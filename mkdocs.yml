site_name: My AI Toolkit
site_description: Personal knowledge base of AI agents and workflows.
site_url: https://mengero.github.io/AICFD/
repo_url: https://github.com/Mengero/AICFD
repo_name: Mengero/AICFD

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - AICFD:
    - Overview: aicfd.md
    - Agent Operating Manual: aicfd-agent-prompt.md
    - Mesh Sensitivity Lessons: aicfd-lessons.md
    - Convergence Lessons (HPC): aicfd-convergence-lessons.md
    - Torso Icepak Persistence Pack: aicfd-persistence-pack.md
  - AI Academic Writing:
    - Overview: academic-writing.md
    - Programmatic .docx Editing: docx-editing-lessons.md
    - Nature Paper Writing Lessons: nature-paper-writing-lessons.md
  - Useful Tools:
    - Blower Scaling Calculator: tool-blower-scaling.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
